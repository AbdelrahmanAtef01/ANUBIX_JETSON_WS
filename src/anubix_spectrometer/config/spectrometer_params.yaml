anubix_spectrometer:
  ros__parameters:
    # Si-NIR Communication Service rev 1 (USB-Ethernet gadget).
    # The Jetson must have a usb0 / enx... interface on the 192.168.137.x
    # subnet. The sensor exposes TWO TCP ports per spec §1:
    #   write_port = 5000  (host → sensor, command packets)
    #   read_port  = 5001  (sensor → host, response packets)
    # Both must be reachable; verify with:
    #   timeout 2 bash -c '</dev/tcp/192.168.137.2/5000'
    #   timeout 2 bash -c '</dev/tcp/192.168.137.2/5001'
    host: "192.168.137.2"
    read_port: 5001
    write_port: 5000
    num_channels: 257             # picks commonWaveNum=POINTS257 (spec §2.1)

    # ── runPSD scan settings — MUST match pyConnect (1).py ─────────────
    # bg.csv and the remote ML model were both trained against these
    # exact parameters. Changing any of them silently invalidates the
    # whole pipeline.
    scan_time_ms: 2000            # pyConnect: scan_time_seconds=2 → 2000ms
    zero_padding: 3               # POINTS32K
    optical_gain: 0               # INTERNAL (sensor-saved gain)
    apodization: 0                # BOXCAR

    verbose_debug: true           # hex-dump every TX/RX packet (turn off in prod)
    connect_timeout_s: 5.0
    read_timeout_s: 15.0          # runPSD response is ~64 KB at 2000ms scan

    bg_file: ""                   # empty = use installed bg.csv from package share

    # ── Multi-read + remote ML ─────────────────────────────────────────
    # pyConnect takes 5 scans, means them, divides by bg.csv, rounds to
    # 8 decimals, then POSTs to the cloud ML endpoint. The local mock
    # analyzer has been removed — the remote URL is mandatory.
    num_reads: 5
    ml_server_url: "http://16.171.254.109:5000/predict"
    ml_timeout_s: 10.0
