anubix_arm:
  ros__parameters:
    # ── mode ─────────────────────────────────────────────────────────────
    # true  = time-sleep mock (no hardware needed)
    # false = real Pro450 via pymycobot over Ethernet
    simulate: false

    # Simulation-only delay (seconds)
    arm_move_delay: 2.0

    # ── home position ────────────────────────────────────────────────────
    # Cartesian (metres, base_link frame) — published as initial
    # /arm/current_pose so the vision node always has a calibration base.
    # On real hardware this is overwritten by actual get_coords() after
    # homing.  In simulation it IS the published pose, so keep it away
    # from the J1 singularity (XY must be > 30 mm).
    home_x: 0.15
    home_y: 0.0
    home_z: 0.3

    # Joint angles (degrees, Pro450 convention)
    home_joint_1: 0.0      # Base rotation
    home_joint_2: 0.0      # Shoulder
    home_joint_3: -90.0    # Elbow
    home_joint_4: 0.0      # Wrist pitch
    home_joint_5: 0.0      # Wrist roll
    home_joint_6: 0.0      # Tool twist

    # ── publishing ───────────────────────────────────────────────────────
    pose_publish_rate_hz: 5.0

    # ── motion (real hardware) ───────────────────────────────────────────
    speed: 20              # Pro450 speed units
    transit_z: 280.0       # mm — safe travel height between moves
    z_floor: 50.0          # mm — hard floor limit (emergency stop below)
    monitor_hz: 0.03       # Z-floor monitor poll interval (seconds)

    # ── hardware connection (Ethernet) ───────────────────────────────────
    arm_host: '192.168.0.232'
    arm_port: 4500
    max_velocity_scaling: 0.5
    max_acceleration_scaling: 0.5
    force_threshold: 2.0
